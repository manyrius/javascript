name: SIBSmartHub
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO
packages:
  TunnelKit:
    url: https://github.com/partout-io/tunnelkit.git
    revision: 5cd1c64be666dd94ea65afcf3c5684fa2c87a925
targets:
  SIBSmartHub:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.benazzi.smarthub.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SIB SmartHub
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Inquadra il QR del portale SIB per attivare questo dispositivo.
        NSLocalNetworkUsageDescription: SIB accede al portale aziendale attraverso il collegamento protetto.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/SIB.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.it.benazzi.smarthub.ios]
    dependencies:
      - target: SIBTunnel
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
  SIBTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.benazzi.smarthub.ios.tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: SIB Collegamento protetto
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/SIBTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.it.benazzi.smarthub.ios]
    dependencies:
      - package: TunnelKit
        product: TunnelKitOpenVPNAppExtension
      - package: TunnelKit
        product: TunnelKitOpenVPN
  SIBTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.benazzi.smarthub.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SIBSmartHub
schemes:
  SIBSmartHub:
    build:
      targets:
        SIBSmartHub: all
    test:
      targets: [SIBTests]
