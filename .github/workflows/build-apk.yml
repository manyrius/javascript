name: Costruisci APK Al Borgo

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accetta licenze e componenti SDK
        run: |
          SDKMGR=$(ls $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlBorgo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rimetti l'APK nel repo (ramo apk-build) per il download
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-build
          git reset --hard >/dev/null 2>&1 || true
          cp "$APK" app-debug.apk
          git add -f app-debug.apk
          git commit -q -m "APK $(date -u +%Y%m%d-%H%M%S)"
          git push -f origin apk-build
