name: Costruisci APK Al Borgo

on:
  push:
  workflow_dispatch:   # si puo lanciare a mano dalla scheda "Actions" di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pubblica l'APK come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: AlBorgo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
