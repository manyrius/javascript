name: Verifica SIB iPhone e iPad
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
concurrency:
  group: sib-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepara progetto Xcode
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compila per iPhone senza firma
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project SIBSmartHub.xcodeproj -scheme SIBSmartHub \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build-device.log
      - name: Prova protocollo di attivazione
        run: |
          cd ios
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcodebuild -project SIBSmartHub.xcodeproj -scheme SIBSmartHub \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SIB-iOS-verifica-compilazione
          path: |
            ios/build-device.log
            ios/build/TestResults.xcresult
          if-no-files-found: warn
